<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Trắc nghiệm AI - Huy</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="container">
            <h1> chương trình ôn tập </h1>
            <p>Tác giả: <span class="author-highlight">Huy</span></p>
        </div>
    </header>

    <div class="container">
        <section id="home-page">
            <div class="grid-layout">
                <div class="card">
                    <h3><i class="fas fa-file-upload"></i> Tải tài liệu</h3>
                    <input type="file" id="fileInput" accept=".txt,.json">
                    
                    <h3><i class="fas fa-sliders-h"></i> Thiết lập</h3>
                    <div class="settings">
                        <label><input type="checkbox" id="shuffleQuiz"> Xáo trộn câu hỏi</label>
                        <label><input type="checkbox" id="shuffleAns"> Xáo trộn đáp án</label>
                        <label><input type="checkbox" id="reverseOrder"> Đảo thứ tự câu hỏi</label>
                        <div class="timer-config">
                            <label>Thời gian toàn bài (phút): <input type="number" id="fullTime" value="15"></label>
                        </div>
                    </div>

                    <div class="ai-box">
                        <textarea id="aiPrompt" placeholder="Nhập yêu cầu tạo hoặc mở rộng bài trắc nghiệm..."></textarea>
                        <small>Khung để tạo bài trắc nghiệm mới theo yêu cầu hoặc mở rộng các câu từ file cần điền thêm thông tin để mở rộng và tạo câu trắc nghiệm thêm</small>
                    </div>

                    <button id="startBtn" class="btn-primary">Bắt đầu làm bài</button>
                </div>

                <div class="card">
                    <h3><i class="fas fa-trophy"></i> Lịch sử & Xếp hạng</h3>
                    <div id="historyList" class="history-container">
                        </div>
                </div>
            </div>
        </section>

        <section id="quiz-page" style="display:none">
            <div class="quiz-nav-top">
                <button class="exit-btn" onclick="askExit()">X</button>
                <div id="timerDisplay">00:00</div>
            </div>
            
            <div id="quizContent"></div>

            <div class="bottom-nav">
                <div id="questionNodes" class="nodes"></div>
                <button id="submitBtn" class="btn-success">Nộp bài</button>
            </div>
        </section>
    </div>

    <footer class="footer">Thiết kế bởi Huy &copy; 2026</footer>
    <script src="script.js"></script>
</body>
</html>
